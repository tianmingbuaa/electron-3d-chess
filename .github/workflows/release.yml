name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            artifact: linux-x64
            package_glob: release/*.AppImage
            builder_args: --linux AppImage --x64
          - name: Windows x64
            os: windows-latest
            artifact: windows-x64
            package_glob: release/*.exe
            builder_args: --win nsis --x64
          - name: macOS x64 + arm64
            os: macos-latest
            artifact: macos-x64-arm64
            package_glob: release/*.dmg
            builder_args: --mac dmg --x64 --arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p 'require("./package.json").version')"
          if [[ "$tag" != "$version" ]]; then
            echo "::error title=Version mismatch::Tag '$GITHUB_REF_NAME' does not match package.json version '$version'."
            exit 1
          fi
          echo "Releasing version $version"

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build application
        run: pnpm build

      # Packaging runs on each native runner. Builds are intentionally unsigned;
      # add signing secrets/CSC env variables later if distribution requires it.
      - name: Package
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder ${{ matrix.builder_args }} --publish never

      - name: List artifacts
        shell: bash
        run: ls -lah release

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: nocturne-chess-${{ matrix.artifact }}
          path: ${{ matrix.package_glob }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: nocturne-chess-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Nocturne Chess ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: release-assets/*
